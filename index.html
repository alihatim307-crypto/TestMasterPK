<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestMasterPK - Your Partner in Exam Preparation</title>
<style>
:root{--g1:#0f3d31;--g2:#1a6b54;--gold:#f2c46d;--bg:#f6f8f7;--mu:#5d716b;--bd:#dde6e2}
*{box-sizing:border-box;margin:0}
body{font-family:Roboto,Arial,sans-serif;background:var(--bg);color:#16302a;line-height:1.5}
a{color:inherit;text-decoration:none}
header{background:var(--g1);color:#fff;text-align:center;padding:16px 12px 8px}
header h1{font-size:28px}header span{color:var(--gold)}header p{font-size:14px;opacity:.85}
nav{background:var(--g2);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5;scrollbar-width:none}
nav a{color:#fff;padding:13px 14px;white-space:nowrap;font-weight:600;font-size:14px;border-bottom:3px solid transparent}
nav a.on{border-color:var(--gold)}
main{max-width:900px;margin:auto;padding:16px 14px 40px}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:12px;padding:26px 14px;text-align:center}
.hero p{margin:8px 0 14px;opacity:.9}
.sb{display:flex;gap:6px;max-width:520px;margin:auto}
.sb input{flex:1;padding:12px;border-radius:8px;border:0;font-size:15px;min-width:0}
.btn{display:inline-block;background:var(--gold);color:var(--g1);border:0;padding:11px 16px;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer}
.btn.g{background:var(--g2);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.back{display:inline-block;color:var(--g2);font-weight:600;margin-top:6px}
h3{margin:20px 0 10px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.cat{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:20px 8px;text-align:center;font-weight:700}
.row{display:block;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:8px;font-weight:600}
.row:after{content:"›";float:right;color:var(--g2);font-size:20px;line-height:1}
.item{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item small{color:var(--mu);display:block}
.item a.dl{background:var(--g2);color:#fff;border-radius:6px;padding:8px 12px;font-size:13px}
.q{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
.ur{color:var(--mu);margin:4px 0 6px;direction:rtl;text-align:right;font-size:16px}
.opt{display:block;width:100%;text-align:left;background:#f1f5f3;border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:6px;font-size:15px;cursor:pointer}
.opt.ok{background:#d6f3df;border-color:#2e9d57}.opt.no{background:#fbdcdc;border-color:#d04646}
.ex{display:none;margin-top:10px;padding:10px;background:#fff8e6;border-radius:8px;direction:rtl;text-align:right;font-size:15px}
.ad{background:#eef2f0;border:1px dashed #b5c4be;color:var(--mu);text-align:center;padding:16px;margin:14px 0;border-radius:8px;font-size:13px}
.pg{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
.score{text-align:center;font-size:22px;padding:20px}
.empty{color:var(--mu);padding:20px;text-align:center;direction:rtl}
.form input,.form textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;font-size:15px;font-family:inherit}
footer{text-align:center;color:var(--mu);font-size:13px;padding:20px}
#st{background:#fff8e6;color:#7a5a00;text-align:center;padding:8px;font-weight:700;font-size:14px}
#tt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--g1);color:#fff;padding:10px 18px;border-radius:24px;opacity:0;transition:.3s;z-index:9;font-weight:600;direction:rtl;white-space:nowrap}
#tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body>
<header><h1>TestMaster<span>PK</span></h1><p>Your Partner in Exam Preparation</p></header>
<nav id="nav"></nav>
<div id="st"></div>
<main id="app"></main>
<footer>© 2026 TestMasterPK</footer>
<script src="data.js"></script>
<script src="subjects.js"></script>
<script src="tree.js"></script>
<script src="mcqs.js"></script>
<script src="mcqs2.js"></script>
<script src="mcqs3.js"></script>
<script src="mcqs4.js"></script>
<script src="mcqs5.js"></script>
<script src="mcqs6.js"></script>
<script src="mcqs7.js"></script>
<script>
const $=s=>document.querySelector(s),app=$("#app"),enc=encodeURIComponent;
const PAGES=[["home","Home"],["mcqs","MCQs"],["papers","Past Papers"],["mocks","Mock Tests"],["notes","PDF Notes"],["jobs","Jobs"],["affairs","Current Affairs"],["contact","Contact"]];
$("#nav").innerHTML=PAGES.map(p=>`<a href="#${p[0]}" data-p="${p[0]}">${p[1]}</a>`).join("");
/* اشتہار: AdSense کوڈ یہاں پیسٹ کریں۔ اشتہار ہر 5 سوالوں کے بعد آتا ہے۔ */
const AD_HTML=`<div class="ad">Advertisement - AdSense code here</div>`;
const AD_EVERY=5,PER=10,SETS={...DEPTS,...SUBJECTS};
const parse=s=>{const p=s.split("|");let o=p.slice(1,5);const c=o[+p[5]];o=o.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);return{q:p[0],o,a:o.indexOf(c),u:p[6]||"",e:p[7]||""}};
const names=t=>Object.keys(TREE).filter(n=>TREE[n].t===t);
const rawQ=(n,k)=>{let a=LEAF[n+"/"+k];if(typeof a==="string")a=LEAF[a.slice(1)];if(a===undefined)a=(TREE[n]&&TREE[n].k[0]===k)?(SETS[n]||[]):[];return a.map(parse)};
const uniq=a=>{const s=new Set();return a.filter(m=>!s.has(m.q)&&s.add(m.q))};
/* ہر ملازمت کے ٹیسٹ میں ان مضامین کے MCQs خود شامل ہوتے ہیں۔ فہرست بدلنی ہو تو یہاں نام بدلیں۔ */
const MIXS=["English","General Knowledge","Pak Study","Islamiat","General Science","Computer","Maths","Current Affairs","Analytical Reasoning"];
const subjQ=s=>uniq(TREE[s].k.flatMap(k=>rawQ(s,k)));
const leafQ=(n,k)=>{if(!TREE[n]||TREE[n].t==="s")return rawQ(n,k);
  const P=[rawQ(n,k),...[...MIXS,...(n==="Teachers"?["Pedagogy"]:[])].filter(x=>TREE[x]).map(subjQ)];
  const out=[];for(let i=0;P.some(p=>i<p.length);i++)P.forEach(p=>{if(i<p.length)out.push(p[i])});return uniq(out)};
const leaves=()=>Object.keys(TREE).flatMap(n=>TREE[n].k.map(k=>[n,k]));
const all=()=>uniq(leaves().flatMap(([n,k])=>rawQ(n,k).map(m=>({...m,n,k}))));
const list=(a,b)=>a.length?a.map(x=>`<div class="item"><div>${x[0]}<small>${x[1]}</small></div><a class="dl" href="${x[2]}" target="_blank">${b}</a></div>`).join(""):`<div class="empty">No items yet.</div>`;
const grid=a=>`<div class="grid">${a.map(n=>`<a class="cat" href="#set/${enc(n)}">${n}</a>`).join("")}</div>`;
function mcqHTML(a,start){return a.map((m,i)=>`<div class="q" data-a="${m.a}"><b>${start+i+1}. ${m.q}</b>${m.u?`<div class="ur">${m.u}</div>`:""}${m.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}${m.e?`<div class="ex">${m.e}</div>`:""}</div>${(start+i+1)%AD_EVERY===0?AD_HTML:""}`).join("")}
function reveal(q,pick){const a=+q.dataset.a,o=q.querySelectorAll(".opt");q.dataset.done=1;if(pick!==undefined)fb(pick===a);o[a].classList.add("ok");if(pick!==undefined&&pick!==a)o[pick].classList.add("no");const e=q.querySelector(".ex");if(e)e.style.display="block"}
function bind(){document.querySelectorAll(".q[data-a]").forEach(q=>q.onclick=e=>{const b=e.target.closest(".opt");if(!b||q.dataset.done)return;reveal(q,+b.dataset.j)});
  const sa=$("#sa");if(sa)sa.onclick=()=>document.querySelectorAll(".q[data-a]").forEach(q=>reveal(q))}
const S=(()=>{try{return JSON.parse(localStorage.tm||"{}")}catch(e){return{}}})();
const sv=()=>{try{localStorage.tm=JSON.stringify(S)}catch(e){}};
function stats(){$("#st").innerHTML=`🔥 ${S.days||0} day streak &nbsp;·&nbsp; ⭐ ${S.xp||0} XP`}
function streak(){const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();if(S.last!==t){S.days=S.last===y?(S.days||0)+1:1;S.last=t;sv()}stats()}
function toast(t){let e=$("#tt");if(!e){e=document.createElement("div");e.id="tt";document.body.appendChild(e)}e.textContent=t;e.className="show";clearTimeout(e.t);e.t=setTimeout(()=>e.className="",1600)}
let run=0;
function fb(ok){run=ok?run+1:0;if(ok){S.xp=(S.xp||0)+10;sv();stats()}
  const G=["شاباش! 🎉","زبردست! 💪","بالکل صحیح! ✅","واہ! ⭐"];
  toast(ok?(run>=3?`🔥 ${run} درست جوابات لگاتار!`:G[Math.floor(Math.random()*G.length)]+" +10 XP"):"کوئی بات نہیں، اگلا سوال آپ کا ہے 👍")}
let M=null;
function runMock(){
  if(!M.q.length){app.innerHTML=`<div class="empty">اس کے MCQs جلد شامل کیے جائیں گے۔</div>`;return}
  if(M.i>=M.q.length){app.innerHTML=`<div class="score">${M.t}<br><b>Score: ${M.s} / ${M.q.length}</b><br>${M.s/M.q.length>=.8?"🏆 شاندار! آپ تیار ہیں":M.s/M.q.length>=.5?"👍 اچھا، تھوڑی اور محنت":"💪 دوبارہ کوشش کریں، آپ بہتر ہوں گے"}</div><a class="btn" href="#mocks">Back to Mock Tests</a>${AD_HTML}`;return}
  const q=M.q[M.i];
  app.innerHTML=`<h3>${M.t}</h3><div class="q"><b>Question ${M.i+1} of ${M.q.length}<br>${q.q}</b>${q.u?`<div class="ur">${q.u}</div>`:""}${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(+b.dataset.j===q.a)M.s++;fb(+b.dataset.j===q.a);
    app.querySelectorAll(".opt").forEach((o,j)=>{o.disabled=true;if(j===q.a)o.classList.add("ok")});
    if(+b.dataset.j!==q.a)b.classList.add("no");
    setTimeout(()=>{M.i++;runMock()},900)})}
const V={
home(){app.innerHTML=`<div class="hero"><h2>Prepare Smarter, Achieve More!</h2><p>Free Online Study Resources for Pakistan Government Job Tests.</p>
<div class="sb"><input id="s" placeholder="Search MCQs, Past Papers, Jobs..."><button class="btn" id="sg">Search</button></div></div>
<div id="res"></div><a class="btn" style="display:block;text-align:center;margin-top:14px" href="#daily">🎯 Daily Challenge - 5 Quick Questions</a><h3>Departments</h3>${grid(names("d"))}<h3>Subjects</h3>${grid(names("s"))}${AD_HTML}
<h3>Latest Jobs</h3>${list(JOBS.slice(0,3),"Details")}`;
  const go=()=>{const k=$("#s").value.trim().toLowerCase();if(!k){$("#res").innerHTML="";return}
    const r=[...all().filter(m=>m.q.toLowerCase().includes(k)).map(m=>[m.q,m.n+" - "+m.k,`#leaf/${enc(m.n)}/${enc(m.k)}`]),...[...PAPERS,...JOBS,...NOTES].filter(x=>x[0].toLowerCase().includes(k))];
    $("#res").innerHTML=`<h3>Results</h3>${r.length?list(r.slice(0,20),"Open"):'<div class="empty">Nothing found.</div>'}`};
  $("#sg").onclick=go;$("#s").onkeydown=e=>{if(e.key==="Enter")go()}},
mcqs(){app.innerHTML=`<h3>MCQs by Department</h3>${grid(names("d"))}${AD_HTML}<h3>MCQs by Subject</h3>${grid(names("s"))}`},
set(n){if(!TREE[n])return location.hash="mcqs";
  const d=TREE[n].t==="d";
  app.innerHTML=`<a class="back" href="#mcqs">← Back</a><h3>${n}</h3><p style="color:var(--mu);margin-bottom:10px">${d?"Select a post":"Select a chapter"}</p>${TREE[n].k.map(k=>`<a class="row" href="#leaf/${enc(n)}/${enc(k)}">${k}</a>`).join("")}${AD_HTML}`},
leaf(n,k,pg){if(!TREE[n])return location.hash="mcqs";
  const a=leafQ(n,k),pages=Math.max(1,Math.ceil(a.length/PER)),p=Math.min(Math.max(+pg||1,1),pages),st=(p-1)*PER,b=`#leaf/${enc(n)}/${enc(k)}`;
  if(!a.length){app.innerHTML=`<a class="back" href="#set/${enc(n)}">← Back</a><h3>${n} - ${k}</h3><div class="empty">اس کے MCQs جلد شامل کیے جائیں گے۔</div>${AD_HTML}`;return}
  app.innerHTML=`<a class="back" href="#set/${enc(n)}">← Back</a><h3>${n} - ${k}</h3><div class="bar"><a class="btn" href="#mock/${enc(n)}/${enc(k)}">Start Mock Test</a><button class="btn g" id="sa">Show All Answers</button></div>${AD_HTML}${mcqHTML(a.slice(st,st+PER),st)}
  <div class="pg">${p>1?`<a class="btn g" href="${b}/${p-1}">Previous</a>`:"<span></span>"}<span>Page ${p} of ${pages}</span>${p<pages?`<a class="btn" href="${b}/${p+1}">Next</a>`:"<span></span>"}</div>`;bind()},
mocks(){const L=leaves().filter(([n,k])=>leafQ(n,k).length);
  app.innerHTML=`<h3>Mock Tests</h3>${AD_HTML}${L.map(([n,k])=>`<div class="item"><div>${n} - ${k}<small>Mock Test</small></div><a class="dl" href="#mock/${enc(n)}/${enc(k)}">Start</a></div>`).join("")||'<div class="empty">Coming soon.</div>'}`},
daily(){M={t:"🎯 Daily Challenge",q:[...all()].sort(()=>Math.random()-.5).slice(0,5),i:0,s:0};runMock()},
mock(n,k){M={t:n+" - "+k,q:leafQ(n,k),i:0,s:0};runMock()},
papers(){app.innerHTML=`<h3>Past Papers</h3>${AD_HTML}${list(PAPERS,"Download")}`},
notes(){app.innerHTML=`<h3>PDF Notes</h3>${AD_HTML}${list(NOTES,"Download")}`},
jobs(){app.innerHTML=`<h3>Jobs</h3>${AD_HTML}${list(JOBS,"Details")}`},
affairs(){app.innerHTML=`<h3>Current Affairs</h3>${AD_HTML}${list(AFFAIRS,"Read")}`},
contact(){app.innerHTML=`<h3>Contact</h3><div class="form"><input id="cn" placeholder="Your name"><textarea id="cm" rows="5" placeholder="Your message"></textarea><button class="btn" id="cs">Send message</button></div>`;
  $("#cs").onclick=()=>location.href="mailto:alihatim307@gmail.com?subject=TestMasterPK&body="+encodeURIComponent($("#cm").value+"\n"+$("#cn").value)}};
function route(){const[p,a,b,pg]=(location.hash||"#home").slice(1).split("/");const k=V[p]?p:"home";
  document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.dataset.p===(k==="set"||k==="leaf"?"mcqs":k==="mock"?"mocks":k)));
  V[k](decodeURIComponent(a||""),decodeURIComponent(b||""),pg);window.scrollTo(0,0)}
addEventListener("hashchange",route);streak();route();
</script></body></html>
